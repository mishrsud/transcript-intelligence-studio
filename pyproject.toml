[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-transcriber"
version = "0.1.0"
description = "Caption-first YouTube transcription"
requires-python = ">=3.11"
dependencies = ["youtube-transcript-api==1.2.4", "requests>=2.32,<3", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.20,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx2>=2,<3"]
audio = ["faster-whisper==1.2.1"]

[project.scripts]
youtube-transcriber = "youtube_transcriber.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
